name: Windows

# The entire per-repo cost of Windows CI. The Nix install and cache, the
# target-existence guard, the cold-cache refusal, the PE-format and
# import-closure gates, the artifact hand-off and its round-trip check, the wine
# pre-filter and the real-Windows execution all live once in
# logos-co/logos-windows-ci.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  windows:
    uses: logos-co/logos-windows-ci/.github/workflows/windows-ci.yml@v1
    secrets: inherit
    with:
      # `cli` rather than `default`: it is the target that produces lgpm.exe.
      # Measured on the Linux builder from this repo's own master --
      # bin/lgpm.exe plus 18 DLLs and two import libraries -- so the default
      # min-pes of 1 is satisfied and needs no override.
      targets: cli
      # The exercise half of doctests/lgpm-cli.test.yaml: 12 of its 13 `run:`
      # steps drive only the built binary, and the 13th is `targets: cli` above.
      # So the doc-tested install lifecycle runs on real Windows without
      # doctest.py, which cannot run there, having to change.
      #
      # A committed file rather than an inline block: an inline `smoke:` is
      # invisible to shellcheck (actionlint replaces expression interpolations
      # with a placeholder before linting), and it cannot be run by hand. This
      # one is shellcheck-clean and runs against a native build via
      #     LGPM=cli/bin/lgpm bash .github/smoke/lgpm-cli.sh
      # which is how its assertions were shown to bite.
      smoke-file: .github/smoke/lgpm-cli.sh
