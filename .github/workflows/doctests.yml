name: lgpm Doc-Tests

# Runs the executable lgpm doc-tests (doctests/*.test.yaml) end-to-end via the
# shared doctest CLI: each spec builds lgpm, packages/installs .lgx files, and
# asserts on lgpm's output. If the docs drift from the tool, this job fails.

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

concurrency:
  group: doctests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctests:
    name: Run lgpm doc-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: logos-co
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # The runner is the shared `doctest` CLI, invoked directly via its flake
      # (github:logos-co/logos-doctest). The flake bundles Python + PyYAML, so no
      # pip install step is needed. Each spec gets its own HTML report.
      - name: Run every doc-test
        run: |
          mkdir -p "${{ runner.temp }}/reports"
          rc=0
          for spec in doctests/*.test.yaml; do
            name="$(basename "${spec%.test.yaml}")"
            echo "::group::doctest run $spec"
            nix run github:logos-co/logos-doctest -- run \
              "$spec" \
              --verbose \
              --continue-on-fail \
              --report "${{ runner.temp }}/reports/${name}.html" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: Verify markdown generation works
        run: |
          for spec in doctests/*.test.yaml; do
            name="$(basename "${spec%.test.yaml}")"
            nix run github:logos-co/logos-doctest -- generate "$spec" -o "/tmp/${name}.md"
            test -s "/tmp/${name}.md"
            echo "Generated /tmp/${name}.md ($(wc -l < "/tmp/${name}.md") lines)"
          done

      - name: Upload execution reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lgpm-doctest-reports-${{ matrix.os }}
          path: ${{ runner.temp }}/reports/
          if-no-files-found: warn
