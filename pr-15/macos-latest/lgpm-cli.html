<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutorial Execution Report</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;
    --pass: #2ea043; --fail: #f85149; --info: #d29922;
    --code-bg: #0b0f14;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--border); padding: 12px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .pill { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.pass { background: rgba(46,160,67,.15); color: var(--pass); }
  .pill.fail { background: rgba(248,81,73,.15); color: var(--fail); }
  .pill.skip { background: rgba(210,153,34,.15); color: var(--info); }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
  main { max-width: 1600px; margin: 0 auto; padding: 16px; }
  .tutorial-title { font-size: 20px; font-weight: 700; margin: 24px 0 8px; color: #fff; }
  .row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    border: 1px solid var(--border); border-radius: 8px; margin: 10px 0; overflow: hidden;
  }
  .row.preamble, .row.section { grid-template-columns: 1fr; }
  .col { padding: 14px 18px; min-width: 0; }
  .col.left { border-right: 1px solid var(--border); }
  .row.preamble .col.left, .row.section .col.left { border-right: none; }
  .col.right { background: var(--panel); }
  /* A row containing any failed step is tinted red end-to-end so it's
     impossible to miss when scanning the report. */
  .row.has-fail { border-color: var(--fail); box-shadow: 0 0 0 1px var(--fail); }
  .row.has-fail .col.left { background: rgba(248,81,73,.07); border-right-color: var(--fail); }
  .row.has-fail .col.right { background: rgba(248,81,73,.12); }
  .col-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
  .md :first-child { margin-top: 0; }
  .md h1 { font-size: 22px; } .md h2 { font-size: 18px; } .md h3 { font-size: 15px; }
  .md pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; }
  .md code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .md :not(pre) > code { background: rgba(110,118,129,.2); padding: .15em .4em; border-radius: 4px; }
  .md table { border-collapse: collapse; margin: 8px 0; }
  .md th, .md td { border: 1px solid var(--border); padding: 5px 10px; }
  .md blockquote { border-left: 3px solid var(--border); margin: 8px 0; padding: 2px 12px; color: var(--muted); }
  .exec { margin-bottom: 14px; }
  .exec:last-child { margin-bottom: 0; }
  .exec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 4px; }
  .badge.pass { background: rgba(46,160,67,.15); color: var(--pass); }
  .badge.fail { background: rgba(248,81,73,.15); color: var(--fail); }
  .badge.info { background: rgba(210,153,34,.15); color: var(--info); }
  .kind { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .note { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
  pre.cmd { background: var(--code-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 12px; margin: 0 0 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  pre.output { background: #010409; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin: 0; overflow-x: auto; max-height: 360px; overflow-y: auto; color: #b9c1ca; }
  pre.cmd, pre.output { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.45; }
  .empty { color: var(--muted); font-style: italic; font-size: 12.5px; }
  details summary { cursor: pointer; color: var(--accent); font-size: 12px; margin-bottom: 4px; }
</style>
</head>
<body>
<header>
  <h1>Tutorial Execution Report</h1>
  <span id="summary"></span>
  <label style="margin-left:auto; font-size:12px; color:var(--muted)">Tutorial
    <select id="picker"></select>
  </label>
</header>
<main id="main"></main>

<script id="report-data" type="application/json">{"generated_platform": "Darwin", "summary": {"passed": 13, "failed": 0, "skipped": 0}, "tutorials": [{"meta": {"name": "Managing Local Packages with lgpm", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"md": "# Managing Local Packages with lgpm\n\n[`lgpm`](https://github.com/logos-co/logos-package-manager) is the **local**\nLogos package manager. It installs `.lgx` packages into a set of directories,\nscans what is installed, and answers dependency questions \u2014 all offline, with no\nnetwork access (fetching packages is the job of\n[`lgpd`](https://github.com/logos-co/logos-package-downloader)).\n\nWe build the `lgpm` CLI, hand-craft two `.lgx` packages (a\ncore module and a UI plugin that depends on it), install them, and explore them\nwith `list`, `info`, `deps`, and `dependents`.\n\n**What you'll build:** Two installed Logos packages and a working tour of every `lgpm` subcommand.\n\n**What you'll learn:**\n\n- What an `.lgx` package is on disk, and how to build one by hand\n- How to install a local `.lgx` package with `lgpm install --file`\n- How to list, inspect (`info`), and query the dependency graph (`deps` / `dependents`)\n- How `--json` turns every command into machine-readable output\n\n## Prerequisites\n\n- **Nix** with flakes enabled \u2014 used to build the `lgpm` CLI.\n- A Linux or macOS machine (the package variants below cover both).", "execs": []}, {"md": "## Step 1: Build the lgpm CLI\n\n`lgpm` ships as a C++ CLI. Build it straight from the flake and link the\nresult as `./lgpm` so the binary lands at `./lgpm/bin/lgpm`.\n\n> Developing against a local checkout? Replace the GitHub reference with\n> `.`, e.g. `nix build '.#cli' -o lgpm`.", "execs": []}, {"md": "### 1.1 Build lgpm\n\n```bash\nnix build 'github:logos-co/logos-package-manager#cli' -o lgpm\n```\n\nThe `-o lgpm` flag names the result symlink, so the executable is at\n`./lgpm/bin/lgpm`.", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-package-manager#cli' -o lgpm", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 1.2 Confirm it runs\n\n```bash\n./lgpm/bin/lgpm --version\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --version", "status": "pass", "exit_code": 0, "output": "lgpm version 1.0.0\n", "note": ""}]}, {"md": "## Step 2: Detect the platform variant\n\nAn `.lgx` package carries one or more **platform variants**. A dev build of\n`lgpm` installs the variant matching this machine with a `-dev` suffix (for\nexample `linux-x86_64-dev` or `darwin-arm64-dev`). Detect it once and stash\nit in a file so the packaging steps can reuse it.", "execs": []}, {"md": "### 2.1 Write the variant name to ./variant\n\n```bash\ncase \"$(uname -s) $(uname -m)\" in\n  \"Linux x86_64\")   echo linux-x86_64-dev  > variant ;;\n  \"Linux aarch64\")  echo linux-arm64-dev   > variant ;;\n  \"Darwin arm64\")   echo darwin-arm64-dev  > variant ;;\n  \"Darwin x86_64\")  echo darwin-x86_64-dev > variant ;;\n  *) echo \"unsupported platform: $(uname -sm)\" >&2; exit 1 ;;\nesac\necho \"variant: $(cat variant)\"\n\n```", "execs": [{"kind": "run", "cmd": "case \"$(uname -s) $(uname -m)\" in\n  \"Linux x86_64\")   echo linux-x86_64-dev  > variant ;;\n  \"Linux aarch64\")  echo linux-arm64-dev   > variant ;;\n  \"Darwin arm64\")   echo darwin-arm64-dev  > variant ;;\n  \"Darwin x86_64\")  echo darwin-x86_64-dev > variant ;;\n  *) echo \"unsupported platform: $(uname -sm)\" >&2; exit 1 ;;\nesac\necho \"variant: $(cat variant)\"\n", "status": "pass", "exit_code": 0, "output": "variant: darwin-arm64-dev\n", "note": ""}]}, {"md": "## Step 3: Create the core module package\n\nAn `.lgx` file is just a **gzipped tar archive** with a `manifest.json` at\nits root and the payload under `variants/<platform>/`. `lgpm` reads the\nmanifest to learn the package's name, version, type, dependencies, and entry\npoint \u2014 so a hand-built tarball is a perfectly valid package d/greeter/manifest.json.bak\nmkdir -p \"build/greeter/variants/$VARIANT\"\necho 'stub library' > \"build/greeter/variants/$VARIANT/greeter.dylib\"\ntar -C build/greeter -czf greeter.lgx manifest.json variants\n", "status": "pass", "exit_code": 0, "output": "", "note": ""}, {"kind": "run", "cmd": "tar -tzf greeter.lgx", "status": "pass", "exit_code": 0, "output": "manifest.json\nvariants/\nvariants/darwin-arm64-dev/\nvariants/darwin-arm64-dev/greeter.dylib\n", "note": ""}]}, {"md": "## Step 4: Create the UI plugin package\n\nNow a **UI plugin** named `greeter_ui` whose manifest declares a dependency\non `greeter`. The `dependencies` array is what powers `deps` / `dependents`.", "execs": []}, {"md": "### 4.1 Write greeter_ui's manifest\n\n```json\n{\n  \"manifestVersion\": \"0.2.0\",\n  \"name\": \"greeter_ui\",\n  \"version\": \"1.0.0\",\n  \"description\": \"A face for greeter\",\n  \"author\": \"Logos\",\n  \"type\": \"ui\",\n  \"category\": \"demo\",\n  \"icon\": \"\",\n  \"dependencies\": [\"greeter\"],\n  \"main\": { \"PLACEHOLDER_VARIANT\": \"greeter_ui.dylib\" }\n}\n```", "execs": [{"kind": "file", "cmd": "write build/greeter_ui/manifest.json", "status": "pass", "note": "Wrote build/greeter_ui/manifest.json"}]}, {"md": "### 4.2 Stamp the variant and pack it\n\n```bash\nVARIANT=\"$(cat variant)\"\nsed -i \"s/PLACEHOLDER_VARIANT/$VARIANT/\" build/greeter_ui/manifest.json\nmkdir -p \"build/greeter_ui/variants/$VARIANT\"\necho 'stub library' > \"build/greeter_ui/variants/$VARIANT/greeter_ui.so\"\ntar -C build/greeter_ui -czf greeter_ui.lgx manifest.json variants\n```", "execs": [{"kind": "run", "cmd": "VARIANT=\"$(cat variant)\"\nsed -i.bak \"s/PLACEHOLDER_VARIANT/$VARIANT/\" build/greeter_ui/manifest.json && rm -f build/greeter_ui/manifest.json.bak\nmkdir -p \"build/greeter_ui/variants/$VARIANT\"\necho 'stub library' > \"build/greeter_ui/variants/$VARIANT/greeter_ui.dylib\"\ntar -C build/greeter_ui -czf greeter_ui.lgx manifest.json variants\n", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "## Step 5: Install the packages\n\n`lgpm` installs into the directories you give it \u2014 `--modules-dir` and\n`--ui-plugins-dir` \u2014 and later scans both. Pass both on every command so it\nsees the whole set. Our hand-built packages are unsigned, so we add\n`--allow-unsigned`.", "execs": []}, {"md": "### 5.1 Install the core module\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins --allow-unsigned install --file ./greeter.lgx\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins --allow-unsigned install --file ./greeter.lgx", "status": "pass", "exit_code": 0, "output": "Installing from file: ./greeter.lgx... done\nInstalled to: ./modules\n", "note": ""}]}, {"md": "### 5.2 Install the UI plugin\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins --allow-unsigned install --file ./greeter_ui.lgx\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins --allow-unsigned install --file ./greeter_ui.lgx", "status": "pass", "exit_code": 0, "output": "Installing from file: ./greeter_ui.lgx... done\nInstalled to: ./plugins\n", "note": ""}]}, {"md": "## Step 6: List what's installed\n\n`list` scans every configured directory and prints a table of installed\npackages. Pass both directories so it sees the module and the plugin.", "execs": []}, {"md": "### 6.1 List packages\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins list\n```\n\nOutput (abridged):\n\n```\nFound 2 installed module(s):\n\nNAME                           VERSION         TYPE       CATEGORY\n----------------------------------------------------------------------\ngreeter                        1.0.0           core       demo\ngreeter_ui                     1.0.0           ui         demo\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins list", "status": "pass", "exit_code": 0, "output": "Found 2 installed module(s):\n\nNAME                           VERSION         TYPE       CATEGORY       \n----------------------------------------------------------------------\ngreeter                        1.0.0           core       demo           \ngreeter_ui                     1.0.0           ui         demo           \n", "note": ""}]}, {"md": "## Step 7: Inspect a package with info\n\n`info <name>` prints the full record for a single installed package. Add\n`--json` for the machine-readable form \u2014 handy for scripting.", "execs": []}, {"md": "### 7.1 Human-readable info\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins info greeter\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins info greeter", "status": "pass", "exit_code": 0, "output": "Name: greeter\nVersion: 1.0.0\nDescription: Says hello\nType: core\nCategory: demo\nAuthor: Logos\nDirectory: ./modules/greeter\nDependencies: none\n", "note": ""}]}, {"md": "### 7.2 JSON info\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins info greeter_ui --json\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins info greeter_ui --json", "status": "pass", "exit_code": 0, "output": "{\n  \"author\": \"Logos\",\n  \"category\": \"demo\",\n  \"dependencies\": [\n    \"greeter\"\n  ],\n  \"description\": \"A face for greeter\",\n  \"hashes\": {\n    \"root\": \"\"\n  },\n  \"icon\": \"\",\n  \"installDir\": \"./plugins/greeter_ui\",\n  \"installType\": \"user\",\n  \"license\": \"\",\n  \"mainFilePath\": \"./plugins/greeter_ui/greeter_ui.dylib\",\n  \"name\": \"greeter_ui\",\n  \"type\": \"ui\",\n  \"version\": \"1.0.0\",\n  \"view\": \"\"\n}\n", "note": ""}]}, {"md": "## Step 8: Query the dependency graph\n\n`deps` lists what a package depends on; `dependents` lists what depends on\nit. These read the `dependencies` arrays across every installed package, so\nboth directories must be configured.", "execs": []}, {"md": "### 8.1 What does greeter_ui depend on?\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins deps greeter_ui\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins deps greeter_ui", "status": "pass", "exit_code": 0, "output": "greeter\n", "note": ""}]}, {"md": "### 8.2 What depends on greeter?\n\n```bash\n./lgpm/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins dependents greeter\n```\n\nBoth commands accept `-r` / `--recursive` to walk the graph transitively,\nand `--json` to emit a JSON array instead of one name per line.", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules --ui-plugins-dir ./plugins dependents greeter", "status": "pass", "exit_code": 0, "output": "greeter_ui\n", "note": ""}]}, {"md": "## Recap\n\nYou built `lgpm`, hand-crafted two `.lgx` archives (a gzipped tar of a\n`manifest.json` plus a `variants/` tree), installed them, and toured every\n`lgpm` subcommand:\n\n| Command | What it does |\n|---|---|\n| `install --file <pkg>` | Install one `.lgx` (use `--dir` for a whole folder) |\n| `list` | Table of everything installed |\n| `info <name>` | Full record for one package (`--json` for machine output) |\n| `deps <name>` | What a package depends on (`-r` for transitive) |\n| `dependents <name>` | What depends on a package (`-r` for transitive) |", "execs": []}]}]}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });
  }

  picker.addEventListener("change", () => render(+picker.value));
  render(0);
</script>
</body>
</html>
